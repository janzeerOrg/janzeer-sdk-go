name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.26', 'stable']
        include:
          - { os: macos-latest, go: stable }
          - { os: windows-latest, go: stable }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # the vendored conformance vectors must be the published ones, byte for byte
      - name: vectors are unmodified
        if: runner.os == 'Linux'
        run: cd internal/vectors && sha256sum -c SHA256SUMS
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test -race -count=1 ./...
      - name: builds without cgo, examples included
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - run: go run ./examples/vault
